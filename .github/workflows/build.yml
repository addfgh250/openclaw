name: Build OpenClaw for ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build OpenClaw
      run: pnpm build

    - name: Package artifacts
      run: |
        mkdir -p dist/package
        cp -r dist/ openclaw.mjs package.json node_modules/ dist/package/
        cd dist/package
        tar -czf ../openclaw-built.tar.gz .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-built
        path: dist/openclaw-built.tar.gz
