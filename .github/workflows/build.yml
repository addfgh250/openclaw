name: Build OpenClaw for ARM64 (Optimized for Dimensity 700)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm and pkg
      run: |
        npm install -g pnpm pkg

    - name: Install dependencies
      run: pnpm install

    - name: Build OpenClaw (TypeScript -> JS)
      run: pnpm build || echo "No build script, skipping"

    - name: Package standalone binary for ARM64 Linux
      run: |
        # 确定入口文件，可能是 openclaw.mjs 或 dist/index.js
        if [ -f "openclaw.mjs" ]; then
          pkg openclaw.mjs --targets node22-linux-arm64 --output openclaw
        elif [ -f "dist/index.js" ]; then
          pkg dist/index.js --targets node22-linux-arm64 --output openclaw
        else
          pkg . --targets node22-linux-arm64 --output openclaw
        fi

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-dimensity700
        path: openclaw
